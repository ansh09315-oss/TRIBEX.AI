version: '3.8'

services:
  # 1. PostgreSQL Relational Database (With Init Schema & Seed Data)
  db:
    image: postgres:16-alpine
    container_name: tribex_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tribex_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tribex_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-tribex_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ../database/seed_mock_data.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tribex_admin} -d ${POSTGRES_DB:-tribex_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - tribex_network

  # 2. Redis High-Throughput Cache & Task Queue (AOF Enabled)
  redis:
    image: redis:7-alpine
    container_name: tribex_redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - tribex_network

  # 3. MinIO S3-Compatible Encrypted Object Vault
  minio:
    image: minio/minio:latest
    container_name: tribex_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minio_tribex_admin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minio_tribex_secure_password_2026}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - tribex_network

  # MinIO Auto Bucket Creator
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${S3_ACCESS_KEY:-minio_tribex_admin} ${S3_SECRET_KEY:-minio_tribex_secure_password_2026};
      /usr/bin/mc mb myminio/tribex-encrypted-vault;
      /usr/bin/mc anonymous set download myminio/tribex-encrypted-vault;
      exit 0;
      "
    networks:
      - tribex_network

  # 4. FastAPI High-Throughput Microservice Backend (Python 3.11)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: tribex_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      - POSTGRES_SERVER=db
      - POSTGRES_USER=${POSTGRES_USER:-tribex_admin}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-tribex_secure_pass_2026}
      - POSTGRES_DB=${POSTGRES_DB:-tribex_db}
      - POSTGRES_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - S3_ENDPOINT=http://minio:9000
      - S3_ACCESS_KEY=${S3_ACCESS_KEY:-minio_tribex_admin}
      - S3_SECRET_KEY=${S3_SECRET_KEY:-minio_tribex_secure_password_2026}
      - S3_BUCKET_NAME=tribex-encrypted-vault
    ports:
      - "8000:8000"
    networks:
      - tribex_network

  # 5. React PWA Frontend via Nginx Reverse Proxy
  frontend:
    image: nginx:alpine
    container_name: tribex_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
    volumes:
      - ../dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - tribex_network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

networks:
  tribex_network:
    driver: bridge
